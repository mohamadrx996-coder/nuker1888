<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070809">
<meta name="description" content="TRJ Tool12 - Discord Server Manager">
<title>TRJ Tool12 - Server Manager</title>

<link rel="preconnect" href="https://discord.com" crossorigin>
<link rel="preconnect" href="https://cdn.discordapp.com" crossorigin>
<link rel="dns-prefetch" href="https://discord.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">

<style>
:root {
  --bg: #070809;
  --bg-1: #0d0e10;
  --fg: #e8e6e3;
  --muted: #71717a;
  --accent: #ff4538;
  --accent-dim: #ff453880;
  --card: #0f1012;
  --border: #27272a;
  --green: #10b981;
  --red: #ef4444;
  --cyan: #06b6d4;
  --purple: #a855f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#app { max-width: 960px; margin: 0 auto; padding: 20px 14px 80px; }
header { text-align: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1.2; }
h1 span { color: var(--accent); }
.subtitle { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.card h2 { font-size: 0.95rem; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.icon { font-size: 1.1rem; }
.input-group { margin-bottom: 10px; }
label { font-size: 0.75rem; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
input, select, textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 10px 12px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
  transition: border 0.15s, box-shadow 0.15s;
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
input::placeholder { color: var(--muted); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  padding: 12px 18px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.85rem;
  border: none;
  cursor: pointer;
  transition: transform 0.08s, opacity 0.15s, background 0.15s;
  font-family: inherit;
  touch-action: manipulation;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: #ff5a4d; }
.btn-secondary { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #000; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.log-area {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  height: 180px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  line-height: 1.5;
  color: #d4d4d4;
  white-space: pre-wrap;
  word-break: break-word;
}
.log-line { margin: 1px 0; }
.log-success { color: var(--green); }
.log-error { color: var(--red); }
.log-info { color: var(--cyan); }
.log-dim { color: var(--muted); }
.progress-bar { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; border-radius: 3px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.stat { background: var(--bg); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; font-size: 0.75rem; }
.stat strong { color: var(--accent); }
.tab-nav {
  display: flex; gap: 6px; margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-btn {
  padding: 8px 14px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.tab-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
.tab-btn:hover:not(.active) { color: var(--fg); border-color: var(--border); }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.15s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.hidden { display: none !important; }
.toast {
  position: fixed; bottom: 18px; left: 14px; right: 14px;
  padding: 11px 16px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  z-index: 1000; animation: slideIn 0.25s;
  font-size: 0.85rem; text-align: center;
}
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--red); }
@keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000; padding: 14px;
}
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
  width: 100%; max-width: 420px;
}
.modal h3 { margin-bottom: 10px; font-size: 1.1rem; }
.modal p { color: var(--muted); margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.guild-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px; max-height: 60vh; overflow-y: auto;
}
.guild-card {
  padding: 12px; border: 1px solid var(--border); border-radius: 10px;
  cursor: pointer; transition: all 0.15s; text-align: center;
  background: var(--bg);
}
.guild-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.guild-icon { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--bg); margin: 0 auto 8px; }
.guild-name { font-weight: 700; font-size: 0.85rem; color: var(--fg); margin-bottom: 2px; }
.guild-meta { font-size: 0.7rem; color: var(--muted); }
footer { text-align: center; color: var(--muted); font-size: 0.65rem; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
@media (max-width: 480px) {
  .btn-grid { grid-template-columns: 1fr; }
  .guild-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div id="app">
<header>
<h1>TRJ <span>.#</span>1888</h1>
<p class="subtitle">Server Manager · Edge Optimized</p>
</header>

<div class="card">
<h2><span class="icon">🔐</span> اتصال البوت</h2>
<div class="input-group">
<label>Bot Token</label>
<input type="password" id="botToken" placeholder="Bot xxxxxxxx.xxxxxxxx.xxxxxxxx أو توكن مستخدم" autocomplete="off">
</div>
<div style="display:flex; gap:10px;">
<button class="btn btn-primary" id="btnConnect" style="flex:1;">🔗 Connect</button>
<button class="btn btn-secondary" id="btnDisconnect" style="flex:1;" disabled>🔌 Disconnect</button>
</div>
<div id="connStatus" class="log-dim" style="margin-top:8px; min-height:1.2em; font-size:0.8rem;">غير متصل</div>
</div>

<div class="tab-nav" role="tablist">
<button class="tab-btn active" data-tab="nuker" role="tab">☢️ Nuker</button>
<button class="tab-btn" data-tab="dm" role="tab">💬 Mass DM</button>
<button class="tab-btn" data-tab="rename" role="tab">✏️ Rename</button>
<button class="tab-btn" data-tab="settings" role="tab">⚙️ Settings</button>
</div>

<div class="tab-panel active" id="tab-nuker" role="tabpanel">
<div class="card">
<h2><span class="icon">☢️</span> Nuker</h2>
<div class="btn-grid">
<button class="btn btn-danger" id="nukeDeleteChannels" disabled>🗑️ Delete Channels</button>
<button class="btn btn-danger" id="nukeCreateChannels" disabled>➕ Create Channels</button>
<button class="btn btn-danger" id="nukeSpam" disabled>📨 Spam</button>
<button class="btn btn-danger" id="nukeRenameGuild" disabled>✏️ Rename Server</button>
<button class="btn btn-danger" id="nukeAdminEveryone" disabled>👑 Admin @everyone</button>
<button class="btn btn-danger" id="nukeBanAll" disabled>🔨 Ban All</button>
<button class="btn btn-danger" id="nukeKickAll" disabled>👢 Kick All</button>
<button class="btn btn-danger" id="nukeDeleteRoles" disabled>🗑️ Delete Roles</button>
<button class="btn btn-danger" id="nukeCreateRoles" disabled>🎭 Create Roles</button>
<button class="btn btn-danger" id="nukeDeleteEmojis" disabled>😀 Delete Emojis</button>
<button class="btn btn-danger" id="nukeNicknames" disabled>📝 Nickname All</button>
</div>
<div class="progress-bar"><div class="progress-fill" id="nukerProgress"></div></div>
</div>
</div>

<div class="tab-panel" id="tab-dm" role="tabpanel">
<div class="card">
<h2><span class="icon">💬</span> Mass DM</h2>
<div class="input-group">
<label>Message</label>
<textarea id="dmMessage" rows="3" placeholder="الرسالة التي سترسل لجميع الأعضاء..."></textarea>
</div>
<button class="btn btn-primary" id="btnMassDM" disabled style="width:100%;">📨 Send DM to All Members</button>
<div class="progress-bar"><div class="progress-fill" id="dmProgress"></div></div>
<div class="stats" id="dmStats" style="display:none;">
<div class="stat">✅ Sent: <strong id="dmSent">0</strong></div>
<div class="stat">❌ Failed: <strong id="dmFailed">0</strong></div>
<div class="stat">📊 Total: <strong id="dmTotal">0</strong></div>
</div>
</div>
</div>

<div class="tab-panel" id="tab-rename" role="tabpanel">
<div class="card">
<h2><span class="icon">✏️</span> Rename All Channels</h2>
<div class="input-group">
<label>Prefix</label>
<input type="text" id="renamePrefix" placeholder="new-name">
</div>
<button class="btn btn-primary" id="btnRenameChannels" disabled style="width:100%;">✏️ Rename All Text Channels</button>
<div class="progress-bar"><div class="progress-fill" id="renameProgress"></div></div>
<div class="stats" id="renameStats" style="display:none;">
<div class="stat">✏️ Renamed: <strong id="renameCount">0</strong></div>
<div class="stat">📊 Total: <strong id="renameTotal">0</strong></div>
</div>
</div>
</div>

<div class="tab-panel" id="tab-settings" role="tabpanel">
<div class="card">
<h2><span class="icon">⚙️</span> Settings</h2>
<div class="input-group">
<label>Channel Names (comma)</label>
<input type="text" id="setChannelNames" placeholder="name1, name2, name3">
</div>
<div class="row">
<div class="input-group"><label>Channel Count</label><input type="number" id="setChannelCount" value="90" min="1" max="500"></div>
<div class="input-group"><label>Spam Count</label><input type="number" id="setSpamCount" value="3" min="1" max="50"></div>
</div>
<div class="input-group"><label>Spam Messages (comma)</label><input type="text" id="setSpamMessages" placeholder="msg1, msg2"></div>
<div class="row">
<div class="input-group"><label>Spam Mode</label><select id="setSpamMode"><option value="normal">Normal</option><option value="webhook">Webhook</option></select></div>
<div class="input-group"><label>Webhook Name</label><input type="text" id="setWhName" value="TRJ"></div>
</div>
<div class="input-group"><label>Role Names (comma)</label><input type="text" id="setRoleNames" placeholder="role1, role2"></div>
<div class="row">
<div class="input-group"><label>Role Count</label><input type="number" id="setRoleCount" value="10" min="1" max="250"></div>
<div class="input-group"><label>Rename Guild</label><input type="text" id="setGuildName" placeholder="New server name"></div>
</div>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem;"><input type="checkbox" id="setChannelCreate" checked> Create Channels</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setChannelDelete" checked> Delete Channels</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setGiveAdmin" checked> Give @everyone Admin</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setBanAll"> Ban All</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setKickAll"> Kick All</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setRoleCreate"> Create Roles</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setRoleDelete"> Delete Roles</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setDeleteEmojis"> Delete Emojis</label>
<label style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:0.8rem; margin-top:6px;"><input type="checkbox" id="setNicknameAll"> Nickname All</label>
<div class="input-group" style="margin-top:8px;"><label>Nickname</label><input type="text" id="setNickname" placeholder="Nickname for all members"></div>
<button class="btn btn-secondary" id="btnSaveSettings" style="width:100%;">💾 Save Settings</button>
</div>
</div>

<div class="card">
<h2><span class="icon">📋</span> Live Log</h2>
<div class="log-area" id="logArea" role="log" aria-live="polite"></div>
</div>

<footer>TRJ Tool12 · Cloudflare Edge · <a href="https://discord.gg/aWS4P43P3f" target="_blank" style="color:var(--accent);">Discord</a></footer>
</div>

<div class="modal-overlay hidden" id="modalOverlay" role="dialog" aria-modal="true">
<div class="modal">
<h3 id="modalTitle">Confirm</h3>
<p id="modalText">Are you sure?</p>
<div class="modal-actions">
<button class="btn btn-secondary" id="modalCancel">Cancel</button>
<button class="btn btn-danger" id="modalConfirm">Confirm</button>
</div>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
